<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <title>Vortex 2</title>
  <base href="/" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d1124" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-app: radial-gradient(circle at 50% 15%, #1d2552 0%, #0a0d1c 75%);
      --bg-header: rgba(12, 16, 34, 0.92);
      --bg-panel: #151a33;
      --bg-card: #1d2445;
      --bg-input: #0e1226;
      --border-soft: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #98a2c7;
      --water: #0ea5e9;
      --earth: #22c55e;
      --fire: #ef4444;
      --gold: #fbbf24;
      --brand: #5354d8;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body.light-mode {
      --bg-app: linear-gradient(180deg, #eef2ff 0%, #dbe4ff 100%);
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-panel: #ffffff;
      --bg-card: #f1f5f9;
      --bg-input: #e2e8f0;
      --border-soft: rgba(15, 23, 42, 0.12);
      --text-main: #0f172a;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0d1c;
      color: var(--text-main);
      font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    input {
      user-select: text;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      touch-action: manipulation;
    }

    #root {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* HEADER */
    .header {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-soft);
      position: relative;
      z-index: 40;
    }

    .logo-badge {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-main);
    }

    .logo-badge .two {
      background: linear-gradient(135deg, #38bdf8, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 22px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      height: 36px;
      padding: 0 11px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      justify-content: center;
      font-size: 16px;
    }

    .balance-pill {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 800;
    }

    .inr-coin {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe066, #e59400);
      color: #3d2200;
      font-weight: 900;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* BURGER MENU */
    .menu-container {
      position: absolute;
      top: 54px;
      right: 12px;
      width: 284px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 9px;
      z-index: 60;
    }

    .menu-container.open {
      display: flex;
    }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .menu-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .menu-username {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .change-avatar-btn {
      background: transparent;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 0;
      margin-top: 2px;
    }

    .firebase-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      flex-shrink: 0;
    }

    .firebase-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .menu-item.clickable:hover,
    .menu-item.clickable:active {
      background: rgba(128, 128, 128, 0.14);
    }

    .menu-divider {
      height: 1px;
      background: var(--border-soft);
    }

    .switch {
      position: relative;
      width: 38px;
      height: 21px;
      border-radius: 999px;
      background: #475569;
      transition: background 0.2s;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .switch.on {
      background: #22c55e;
    }
    .switch.on::after {
      transform: translateX(17px);
    }

    /* MAIN LAYOUT */
    .main-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 12px calc(8px + var(--safe-bottom));
      gap: 8px;
    }

    /* RING STATUS STRIP */
    .rings-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .ring-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .ring-pill.water { border-left: 4px solid var(--water); }
    .ring-pill.earth { border-left: 4px solid var(--earth); }
    .ring-pill.fire { border-left: 4px solid var(--fire); }

    .ring-pill .val {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    /* VORTEX ARENA */
    .arena {
      flex: 1;
      min-height: 220px;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #vortex-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .result-toast {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(10, 14, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 12;
      white-space: nowrap;
    }

    .result-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* CONTROLS */
    .controls-panel {
      flex-shrink: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payout-spin-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      height: 50px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
      color: #fff;
      transition: transform 0.08s, opacity 0.15s;
    }

    .action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .part-btn {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 3px 0 #1e3a8a;
    }

    .cashout-btn {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      box-shadow: 0 3px 0 #14532d;
    }

    .spin-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-mode-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-mode-btn.active {
      background: #f59e0b;
      color: #111;
      border-color: #fbbf24;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .spin-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #818cf8, #4543bf 70%);
      border: 3px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 22px rgba(83, 84, 216, 0.55);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .spin-btn:active:not(:disabled) {
      transform: scale(0.93);
    }

    .spin-btn.auto-active {
      background: radial-gradient(circle at 35% 30%, #f87171, #dc2626 70%);
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.6);
    }

    .bet-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 3px;
      height: 40px;
    }

    .mini-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 800;
    }

    .bet-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      text-align: center;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
    }

    .fast-bets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .fast-btn {
      height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
    }

    .fast-btn:active {
      transform: scale(0.96);
    }

    /* LIVE WINS */
    .live-wins-bar {
      flex-shrink: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .live-win-sum {
      color: #22c55e;
      font-weight: 900;
    }

    /* MODALS & BONUS GAMES */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 20, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      max-height: 88dvh;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.55;
    }

    /* Earth 3-Reel Slot Bonus */
    .earth-reels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .reel-box {
      height: 82px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 2px solid var(--earth);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #4ade80;
    }

    /* Fire 4x4 Grid Bonus */
    .fire-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .fire-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      background: linear-gradient(180deg, #991b1b, #450a0a);
      border: 2px solid #f87171;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fire-cell.revealed {
      background: #1e293b;
      border-color: #fbbf24;
      color: #fde047;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .avatar-choice {
      height: 58px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 2px solid transparent;
      font-size: 28px;
    }

    .avatar-choice.selected {
      border-color: var(--gold);
    }

    .seed-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #4ade80;
      margin: 6px 0 12px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg-input);
      margin-bottom: 6px;
      font-size: 12px;
    }

    .desktop-only { display: inline-flex; }
    .mobile-only { display: none; }

    @media (max-width: 760px) {
      .desktop-only { display: none; }
      .mobile-only { display: flex; }
      .bet-row { grid-template-columns: 1fr; }
      .ring-pill { font-size: 11px; padding: 6px 8px; }
      .spin-btn { width: 64px; height: 64px; font-size: 13px; }
      .action-btn { height: 46px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- HEADER -->
    <header class="header">
      <div class="logo-badge">
        🌀 VORTEX <span class="two">2</span>
      </div>

      <div class="header-actions">
        <button id="btn-theme" class="pill-btn icon-btn" title="Dark / Light Mode">🌙</button>
        <button id="btn-how" class="pill-btn desktop-only">ℹ️ How to play?</button>

        <button id="btn-balance" class="pill-btn balance-pill" title="Tap to top up if low">
          <span id="balance-text">999 994.00</span>
          <span class="inr-coin">₹</span>
        </button>

        <button id="btn-fullscreen" class="pill-btn icon-btn" aria-label="Fullscreen">⛶</button>
        <button id="btn-burger" class="pill-btn icon-btn" aria-label="Menu">☰</button>
      </div>

      <!-- BURGER MENU -->
      <div id="menu-container" class="menu-container">
        <div class="menu-header">
          <div id="menu-avatar" class="menu-avatar">🌀</div>
          <div style="min-width:0;flex:1;">
            <div id="menu-username" class="menu-username">Player</div>
            <button id="btn-change-avatar" class="change-avatar-btn">Change avatar</button>
          </div>
          <span id="firebase-dot" class="firebase-dot"></span>
        </div>

        <div class="menu-item" id="sound-switch">
          <span>🔊 Sound &amp; Voice</span>
          <div id="toggle-sound" class="switch on"></div>
        </div>

        <div class="menu-divider"></div>

        <button id="btn-fair" class="menu-item clickable"><span>🛡️ Provably fair settings</span><span>›</span></button>
        <button id="btn-rules" class="menu-item clickable"><span>📜 Game rules &amp; Bonuses</span><span>›</span></button>
        <button id="btn-history" class="menu-item clickable"><span>🕒 My bet history</span><span>›</span></button>
        <button id="btn-how-mobile" class="menu-item clickable mobile-only"><span>ℹ️ How to play?</span><span>›</span></button>

        <div class="menu-divider"></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding:0 4px;">
          <span>Turbo Elemental Engine</span>
          <strong id="sync-label">Connecting...</strong>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-layout">
      <!-- 3 ELEMENTAL RING COUNTERS -->
      <section class="rings-strip">
        <div class="ring-pill water">
          <span>💧 Water</span>
          <span id="stat-water" class="val">0/3 · 0x</span>
        </div>
        <div class="ring-pill earth">
          <span>🌿 Earth</span>
          <span id="stat-earth" class="val">0/5 · 0x</span>
        </div>
        <div class="ring-pill fire">
          <span>🔥 Fire</span>
          <span id="stat-fire" class="val">0/8 · 0x</span>
        </div>
      </section>

      <!-- CENTRAL VORTEX WHEEL CANVAS -->
      <section class="arena">
        <canvas id="vortex-canvas"></canvas>
        <div id="result-toast" class="result-toast">Ready to Spin</div>
      </section>

      <!-- CONTROLS PANEL -->
      <section class="controls-panel">
        <div class="payout-spin-row">
          <button id="btn-part-payout" class="action-btn part-btn" disabled>
            <span>PART PAYOUT</span>
            <span id="part-amount">₹0.00</span>
          </button>

          <div class="spin-cluster">
            <button id="btn-turbo" class="mini-mode-btn" title="Turbo Mode">⚡</button>
            <button id="btn-spin" class="spin-btn" title="Tap to Spin or Hold for Autoplay">
              <span id="spin-label">SPIN</span>
              <span style="font-size:9px;opacity:0.8;">HOLD AUTO</span>
            </button>
            <button id="btn-auto" class="mini-mode-btn" title="Autoplay">🔁</button>
          </div>

          <button id="btn-cashout" class="action-btn cashout-btn" disabled>
            <span>CASH OUT</span>
            <span id="cashout-amount">₹0.00</span>
          </button>
        </div>

        <div class="bet-row">
          <div class="input-box">
            <button id="btn-min" class="mini-btn">MIN</button>
            <input id="bet-input" class="bet-input" type="text" inputmode="decimal" value="50" maxlength="9" />
            <button id="btn-max" class="mini-btn">MAX</button>
          </div>
          <div class="fast-bets">
            <button class="fast-btn" data-val="50">50 ₹</button>
            <button class="fast-btn" data-val="100">100 ₹</button>
            <button class="fast-btn" data-val="500">500 ₹</button>
          </div>
        </div>
      </section>

      <!-- LIVE WINS -->

      wind:  { icon: "💨", label: "WIND",  color: "#94a3b8" },
      skull: { icon: "💀", label: "SKULL", color: "#a855f7" },
    };

    async function spinOnce() {
      if (state.spinning || state.inBonus) return;
      const bet = parseBet();
      if (bet > state.balance) {
        state.autoplay = false;
        showToast("Insufficient ₹ balance — tap balance to refill", "#f87171");
        updateUI();
        return;
      }

      state.balance = Number((state.balance - bet).toFixed(2));
      state.spinning = true;
      updateUI();

      // Spin animation
      const spinDuration = state.turbo ? 160 : 620;
      vAnim.spinVel = state.turbo ? 14 : 9;
      const previewIcons = ["💧", "🌿", "🔥", "💨", "💀"];
      const ticker = setInterval(() => {
        const ic = previewIcons[Math.floor(Math.random() * previewIcons.length)];
        vAnim.centerSymbol = ic;
        vAnim.centerLabel = "...";
        audio.spinTick();
      }, 75);

      const outcome = await rollOutcome();
      await new Promise((r) => setTimeout(r, spinDuration));
      clearInterval(ticker);
      vAnim.spinVel = 0;

      if (outcome.type === "element") {
        const rk = outcome.ring;
        const cfg = RINGS[rk];
        const oldStep = state.rings[rk];
        const newStep = Math.min(cfg.max, oldStep + outcome.mult);
        const oldM = cfg.mults[oldStep];
        const newM = cfg.mults[newStep];

        state.rings[rk] = newStep;
        state.ringPots[rk] = Number((state.ringPots[rk] + bet * (newM - oldM)).toFixed(2));

        const sym = SYMBOL_MAP[rk];
        vAnim.centerSymbol = sym.icon;
        vAnim.centerLabel = outcome.mult === 2 ? `${sym.label} x2!` : sym.label;
        vAnim.centerColor = sym.color;
        vAnim.pulseRing = rk;
        vAnim.pulseTime = 0.7;

        audio.hitElement(rk, newStep);
        audio.speak(outcome.mult === 2 ? `${cfg.name} 2x` : cfg.name);
        showToast(`${sym.icon} ${cfg.name} ${newStep}/${cfg.max} (${newM}x)`, sym.color);

        state.spinning = false;
        updateUI();
        syncFirebase();

        // Check if Ring reached Bonus!
        if (newStep >= cfg.max) {
          await triggerBonus(rk, bet);
        }
      } else if (outcome.type === "wind") {
        vAnim.centerSymbol = SYMBOL_MAP.wind.icon;
        vAnim.centerLabel = "WIND";
        vAnim.centerColor = SYMBOL_MAP.wind.color;
        audio.wind();
        showToast("💨 Wind — Progress Saved", "#94a3b8");
        state.spinning = false;
        updateUI();
        syncFirebase();
      } else {
        // Skull: rolls back 1 segment from highest active ring
        vAnim.centerSymbol = SYMBOL_MAP.skull.icon;
        vAnim.centerLabel = "SKULL!";
        vAnim.centerColor = SYMBOL_MAP.skull.color;
        audio.skull();
        audio.speak("Skull");

        const targetRing = state.rings.fire > 0 ? "fire" : state.rings.earth > 0 ? "earth" : state.rings.water > 0 ? "water" : null;
        if (targetRing) {
          const oldS = state.rings[targetRing];
          const newS = oldS - 1;
          const mults = RINGS[targetRing].mults;
          state.rings[targetRing] = newS;
          state.ringPots[targetRing] = newS === 0 ? 0 : Number((state.ringPots[targetRing] * (mults[newS] / mults[oldS])).toFixed(2));
          showToast(`💀 Skull! ${RINGS[targetRing].name} rolled back to ${newS}/${RINGS[targetRing].max}`, "#f87171");
        } else {
          showToast("💀 Skull — No active rings to lose", "#a855f7");
        }

        state.spinning = false;
        updateUI();
        syncFirebase();
      }

      if (state.autoplay && !state.inBonus) {
        setTimeout(() => {
          if (state.autoplay && !state.spinning && !state.inBonus) spinOnce();
        }, state.turbo ? 220 : 480);
      }
    }

    // =========================================================================
    // 9. BONUS GAMES (WATER, EARTH 3-REEL SLOT, FIRE 4x4 GRID)
    // =========================================================================
    async function triggerBonus(ringKey, lastBet) {
      state.inBonus = true;
      audio.bonus();
      const baseRingBet = state.ringPots[ringKey] / RINGS[ringKey].mults[RINGS[ringKey].max] || lastBet;

      if (ringKey === "water") {
        // Water Bonus: Quick Wheel Reveal (5x, 7x, 10x) — does NOT stop Autoplay!
        const picks = [5, 7, 10];
        const mult = picks[Math.floor(Math.random() * picks.length)];
        const win = Math.min(window.env.MAX_WIN, Number((baseRingBet * mult).toFixed(2)));
        state.balance = Number((state.balance + win).toFixed(2));
        state.rings.water = 0;
        state.ringPots.water = 0;

        showToast(`💧 WATER BONUS ${mult}x! +₹${win.toFixed(2)}`, "#38bdf8");
        state.history.unshift({ time: new Date().toLocaleTimeString(), label: `Water Bonus ${mult}x`, win });
        pushLiveWin(win);
        state.inBonus = false;
        updateUI();
        syncFirebase();
        return;
      }

      if (ringKey === "earth") {
        // Earth Bonus pauses Autoplay & opens 3-reel slot (up to 50x)
        state.autoplay = false;
        updateUI();

        await new Promise((resolve) => {
          openModal("🌿 Earth Bonus (3-Reel Slot)", `
            <p>Spin the Earth reels once to win up to <strong>50x</strong>!</p>
            <div class="earth-reels">
              <div id="reel-0" class="reel-box">🌿</div>
              <div id="reel-1" class="reel-box">🌿</div>
              <div id="reel-2" class="reel-box">🌿</div>
            </div>
            <button id="btn-earth-spin" style="width:100%;height:46px;border-radius:10px;background:#22c55e;color:#fff;font-weight:900;font-size:15px;">
              SPIN EARTH BONUS
            </button>
          `, false);

          document.getElementById("btn-earth-spin").addEventListener("click", async (e) => {
            e.target.disabled = true;
            const opts = [15, 25, 35, 50];
            const mult = opts[Math.floor(Math.random() * opts.length)];
            for (let t = 0; t < 10; t++) {
              ["reel-0", "reel-1", "reel-2"].forEach((id) => {
                document.getElementById(id).textContent = `${opts[Math.floor(Math.random() * opts.length)]}x`;
              });
              await new Promise((r) => setTimeout(r, 70));
            }
            ["reel-0", "reel-1", "reel-2"].forEach((id) => {
              document.getElementById(id).textContent = `${mult}x`;
            });
            const win = Math.min(window.env.MAX_WIN, Number((baseRingBet * mult).toFixed(2)));
            state.balance = Number((state.balance + win).toFixed(2));
            state.rings.earth = 0;
            state.ringPots.earth = 0;
            state.history.unshift({ time: new Date().toLocaleTimeString(), label: `Earth Bonus ${mult}x`, win });
            pushLiveWin(win);
            audio.bonus();
            showToast(`🌿 EARTH BONUS ${mult}x! +₹${win.toFixed(2)}`, "#4ade80");
            setTimeout(() => { closeModal(); resolve(); }, 950);
          });
        });

        state.inBonus = false;
        updateUI();
        syncFirebase();
        return;
      }

      if (ringKey === "fire") {
        // Fire Bonus pauses Autoplay & opens 4x4 Pick-and-Win Grid (up to 799x)
        state.autoplay = false;
        updateUI();

        await new Promise((resolve) => {
          const pool = [20, 20, 50, 50, 100, 100, 200, 200, 350, 350, 500, 500, 799, 799, 75, 150];
          pool.sort(() => Math.random() - 0.5);
          const cells = pool.map((v, idx) => `<button class="fire-cell" data-idx="${idx}" data-val="${v}">🔥</button>`).join("");
          openModal("🔥 Fire Bonus (4×4 Pick & Win)", `
            <p>Match any pair of multipliers to win up to <strong>799x</strong>!</p>
            <div class="fire-grid">${cells}</div>
            <div id="fire-picked" style="text-align:center;font-weight:800;min-height:22px;">Pick tiles...</div>
          `, false);

          const seen = {};
          let done = false;
          modalBody.querySelectorAll(".fire-cell").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (done || btn.classList.contains("revealed")) return;
              const val = Number(btn.dataset.val);
              btn.classList.add("revealed");
              btn.textContent = `${val}x`;
              audio.hitElement("fire", 3);
              seen[val] = (seen[val] || 0) + 1;
              if (seen[val] >= 2) {
                done = true;
                const finalMult = Math.min(window.env.MAX_MULT, val);
                const win = Math.min(window.env.MAX_WIN, Number((baseRingBet * finalMult).toFixed(2)));
                state.balance = Number((state.balance + win).toFixed(2));
                state.rings.fire = 0;
                state.ringPots.fire = 0;
                state.history.unshift({ time: new Date().toLocaleTimeString(), label: `Fire Bonus ${finalMult}x`, win });
                pushLiveWin(win);
                audio.bonus();
                document.getElementById("fire-picked").textContent = `MATCHED ${finalMult}x! +₹${win.toFixed(2)}`;
                showToast(`🔥 FIRE BONUS ${finalMult}x! +₹${win.toFixed(2)}`, "#f87171");
                setTimeout(() => { closeModal(); resolve(); }, 1100);
              }
            });
          });
        });

        state.inBonus = false;
        updateUI();
        syncFirebase();
      }
    }

    // =========================================================================
    // 10. CASH OUT & PART PAYOUT (SEQUENTIAL CASHOUTS SUPPORTED)
    // =========================================================================
    elCashBtn.addEventListener("click", () => {
      audio.unlock();
      const total = getTotalPot();
      if (state.spinning || state.inBonus || total <= 0) return;

      state.balance = Number((state.balance + total).toFixed(2));
      state.rings = { water: 0, earth: 0, fire: 0 };
      state.ringPots = { water: 0, earth: 0, fire: 0 };
      audio.bonus();
      showToast(`💰 CASHED OUT +₹${total.toFixed(2)}`, "#4ade80");
      state.history.unshift({ time: new Date().toLocaleTimeString(), label: "Full Cash Out", win: total });
      pushLiveWin(total);
      updateUI();
      syncFirebase();
    });

    elPartBtn.addEventListener("click", () => {
      audio.unlock();
      const part = getPartPayoutInfo();
      if (state.spinning || state.inBonus || !part) return;

      state.balance = Number((state.balance + part.takeAmount).toFixed(2));
      state.rings[part.ring] = part.newStep;
      state.ringPots[part.ring] = Number((state.ringPots[part.ring] - part.takeAmount).toFixed(2));
      audio.hitElement(part.ring, part.newStep);
      showToast(`💸 PART PAYOUT +₹${part.takeAmount.toFixed(2)}`, "#38bdf8");
      state.history.unshift({ time: new Date().toLocaleTimeString(), label: `Part Payout (${RINGS[part.ring].name})`, win: part.takeAmount });
      updateUI();
      syncFirebase();
    });

    // =========================================================================
    // 11. BUTTONS, HOLD-FOR-AUTO, DARK/LIGHT MODE, MODALS
    // =========================================================================
    let holdTimer = null;
    let heldAuto = false;

    elSpinBtn.addEventListener("pointerdown", () => {
      audio.unlock();
      heldAuto = false;
      if (state.autoplay) return;
      holdTimer = setTimeout(() => {
        heldAuto = true;
        state.autoplay = true;
        updateUI();
        if (!state.spinning && !state.inBonus) spinOnce();
      }, 550);
    });

    const endSpinPointer = () => {
      clearTimeout(holdTimer);
    };
    elSpinBtn.addEventListener("pointerup", endSpinPointer);
    elSpinBtn.addEventListener("pointercancel", endSpinPointer);

    elSpinBtn.addEventListener("click", () => {
      audio.unlock();
      if (heldAuto) { heldAuto = false; return; }
      if (state.autoplay) {
        state.autoplay = false;
        updateUI();
      } else {
        spinOnce();
      }
    });

    document.getElementById("btn-auto").addEventListener("click", () => {
      audio.unlock();
      state.autoplay = !state.autoplay;
      updateUI();
      if (state.autoplay && !state.spinning && !state.inBonus) spinOnce();
    });

    document.getElementById("btn-turbo").addEventListener("click", () => {
      state.turbo = !state.turbo;
      updateUI();
    });

    document.getElementById("btn-min").addEventListener("click", () => { elBet.value = window.env.MIN_BET; parseBet(); });
    document.getElementById("btn-max").addEventListener("click", () => { elBet.value = Math.min(window.env.MAX_BET, Math.floor(state.balance)); parseBet(); });
    document.querySelectorAll(".fast-btn").forEach((b) => {
      b.addEventListener("click", () => { elBet.value = b.dataset.val; parseBet(); });
    });
    elBet.addEventListener("change", parseBet);

    document.getElementById("btn-balance").addEventListener("click", () => {
      if (state.balance < 50) {
        state.balance = 10000;
        updateUI();
        syncFirebase();
        showToast("+₹10,000 Demo Credits Added", "#4ade80");
      }
    });

    // Dark / Light Mode toggle
    document.getElementById("btn-theme").addEventListener("click", (e) => {
      const isLight = document.body.classList.toggle("light-mode");
      e.target.textContent = isLight ? "☀️" : "🌙";
    });

    // Burger Menu & Switches
    const menuEl = document.getElementById("menu-container");
    document.getElementById("btn-burger").addEventListener("click", (e) => {
      e.stopPropagation();
      menuEl.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!menuEl.contains(e.target)) menuEl.classList.remove("open");
    });

    document.getElementById("sound-switch").addEventListener("click", () => {
      audio.unlock();
      audio.on = !audio.on;
      document.getElementById("toggle-sound").classList.toggle("on", audio.on);
    });

    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      const d = document.documentElement;
      if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d);
      else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    });

    // Modals
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalClose = document.getElementById("modal-close");

    function openModal(title, html, allowClose = true) {
      menuEl.classList.remove("open");
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalClose.style.display = allowClose ? "inline-block" : "none";
      modalBackdrop.dataset.allowClose = allowClose ? "1" : "0";
      modalBackdrop.classList.add("open");
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
    }

    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop && modalBackdrop.dataset.allowClose === "1") closeModal();
    });

    function openHow() {
      openModal("How to play Vortex 2", `
        <p><strong>1. Choose your bet</strong> (1 ₹ – 5,000 ₹ or quick chips 50 ₹, 100 ₹, 500 ₹) and tap <strong>SPIN</strong> (or hold Spin for Autoplay).</p>
        <p><strong>2. Fill the 3 Elemental Rings:</strong><br>
          • 💧 <strong>Water (3 sectors):</strong> 1.6x, 5x, 10x + Water Bonus (up to 10x)<br>
          • 🌿 <strong>Earth (5 sectors):</strong> 2.5x to 45x + 3-Reel Slot Bonus (up to 50x)<br>
          • 🔥 <strong>Fire (8 sectors):</strong> 4x to 200x + 4×4 Pick Grid Bonus (up to 799x)</p>
        <p><strong>3. Special Symbols:</strong><br>
          • <strong>x2 Booster:</strong> Fills 2 segments at once (won't drop when only 1 sector remains).<br>
          • <strong>Wind 💨:</strong> Neutral spin.<br>
          • <strong>Skull 💀:</strong> Rolls back 1 sector from your highest active ring.</p>
        <p><strong>4. Part Payout &amp; Cash Out:</strong> Lock in partial profits with <strong>Part Payout</strong> or collect everything anytime with <strong>Cash Out</strong>!</p>
      `);
    }
    document.getElementById("btn-how").addEventListener("click", openHow);
    document.getElementById("btn-how-mobile").addEventListener("click", openHow);

    document.getElementById("btn-rules").addEventListener("click", () => {
      openModal("Vortex 2 Rules & RTP", `
        <p><strong>RTP:</strong> 96.00%<br>
           <strong>Max Multiplier:</strong> 999x<br>
           <strong>Max Profit Cap:</strong> ₹${window.env.MAX_WIN.toLocaleString()}<br>
           <strong>Min / Max Bet:</strong> ₹${window.env.MIN_BET} / ₹${window.env.MAX_BET.toLocaleString()}</p>
        <p>Progress on all three rings persists across spins and saves automatically to your Firebase account.</p>
      `);
    });

    document.getElementById("btn-change-avatar").addEventListener("click", () => {
      const grid = AVATARS.map((a) => `<button class="avatar-choice ${a === state.avatar ? "selected" : ""}" data-av="${a}">${a}</button>`).join("");
      openModal("Profile & Avatar", `
        <label style="font-size:12px;font-weight:700;color:var(--text-muted);">Player Name</label>
        <input id="inp-name" value="${state.username}" maxlength="24" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:8px;border:1px solid var(--border-soft);background:var(--bg-input);color:var(--text-main);font-weight:700;" />
        <div class="avatar-grid">${grid}</div>
      `);
      modalBody.querySelectorAll(".avatar-choice").forEach((b) => {
        b.addEventListener("click", () => {
          state.avatar = b.dataset.av;
          modalBody.querySelectorAll(".avatar-choice").forEach((x) => x.classList.remove("selected"));
          b.classList.add("selected");
          updateUI();
          syncFirebase();
        });
      });
      document.getElementById("inp-name").addEventListener("change", (e) => {
        if (e.target.value.trim()) {
          state.username = e.target.value.trim();
          state.nameEditedByUser = true;
          updateUI();
          syncFirebase();
        }
      });
    });

    document.getElementById("btn-fair").addEventListener("click", async () => {
      if (!state.serverSeedHash) state.serverSeedHash = await sha256Hex(state.serverSeed);
      openModal("Provably Fair Settings", `
        <p>Every spin outcome is generated using <code>SHA256(serverSeed:clientSeed:nonce)</code>.</p>
        <strong>Client Seed</strong>
        <div class="seed-box" id="fair-client">${state.clientSeed}</div>
        <strong>Server Seed Hash</strong>
        <div class="seed-box">${state.serverSeedHash}</div>
        <div><strong>Nonce:</strong> ${state.nonce}</div>
        <button id="btn-regen" style="margin-top:12px;padding:10px 14px;border-radius:8px;background:#22c55e;color:#fff;font-weight:800;">Randomize Client Seed</button>
      `);
      document.getElementById("btn-regen").addEventListener("click", () => {
        state.clientSeed = randomHex(12);
        document.getElementById("fair-client").textContent = state.clientSeed;
        saveLocal();
      });
    });

    document.getElementById("btn-history").addEventListener("click", () => {
      const rows = state.history.length
        ? state.history.map((h) => `
          <div class="history-row">
            <div><strong>${h.label}</strong><div style="font-size:11px;color:var(--text-muted);">${h.time}</div></div>
            <div style="font-weight:800;color:#22c55e;">+₹${Number(h.win).toFixed(2)}</div>
          </div>`).join("")
        : "<p>No payouts recorded yet.</p>";
      openModal("My Bet History", rows);
    });

    // Live Wins Ticker
    const SIM = [["🇮🇳", "RohanVortex", 1250], ["🇮🇳", "Priya99", 450], ["🇮🇳", "VikramFire", 3800], ["🇮🇳", "AnanyaWin", 640]];
    function showLiveWin(flag, user, sum) {
      document.getElementById("live-feed-item").innerHTML = `<span>${flag}</span><span>${user}</span><span class="live-win-sum">+₹${Number(sum).toFixed(2)}</span>`;
    }
    setInterval(() => {
      document.getElementById("online-count").textContent = 4750 + Math.floor(Math.random() * 250);
      if (!state.firebaseConnected) {
        const p = SIM[Math.floor(Math.random() * SIM.length)];
        showLiveWin(p[0], p[1], p[2] * (0.7 + Math.random() * 0.7));
      }
    }, 3600);

    // Boot
    updateUI();
    initFirebase();
  </script>
</body>
</html>
