<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <!-- version: f022a49a -->
  <meta charset="utf-8" />
  <title>ChickenRoad2</title>
  <base href="/" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#1e2230" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Luckiest+Guy&family=Montserrat:wght@500;600;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-dark: #191c26;
      --bg-panel: #252938;
      --bg-card: #2e3346;
      --bg-input: #1c202c;
      --border-soft: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #9ca3b8;
      --green-main: #28c76f;
      --gold-main: #ffb800;
      --red-main: #ff4d4f;
      --radius-lg: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    input {
      user-select: text;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      touch-action: manipulation;
    }

    #root {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #2b3248 0%, #161923 72%);
    }

    /* HEADER */
    .header {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(22, 25, 35, 0.94);
      border-bottom: 1px solid var(--border-soft);
      position: relative;
      z-index: 40;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      font-family: 'Luckiest Guy', cursive;
      font-size: 22px;
      letter-spacing: 0.6px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 0 #c96400, 0 4px 10px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-badge span.two {
      background: linear-gradient(180deg, #ffe066 0%, #ff9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 25px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .balance-pill {
      background: linear-gradient(180deg, #32384e 0%, #262b3d 100%);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      gap: 7px;
    }

    .inr-coin {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe066, #e59400);
      color: #3d2200;
      font-weight: 900;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      justify-content: center;
    }

    .firebase-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffb800;
      box-shadow: 0 0 8px #ffb800;
      display: inline-block;
      flex-shrink: 0;
    }
    .firebase-dot.connected {
      background: #28c76f;
      box-shadow: 0 0 8px #28c76f;
    }

    /* BURGER MENU */
    .menu-container {
      position: absolute;
      top: 56px;
      right: 12px;
      width: 286px;
      background: #262a3a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.6);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 60;
    }
    .menu-container.open {
      display: flex;
      animation: fadeSlide 0.16s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .menu-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1b1e29;
      border: 2px solid var(--gold-main);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .menu-user-info {
      min-width: 0;
      flex: 1;
    }

    .menu-username {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .change-avatar-btn {
      margin-top: 3px;
      background: transparent;
      color: var(--gold-main);
      font-size: 11px;
      font-weight: 700;
      padding: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .menu-item.clickable:hover,
    .menu-item.clickable:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-divider {
      height: 1px;
      background: var(--border-soft);
      margin: 2px 0;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      border-radius: 999px;
      background: #424860;
      transition: background 0.2s;
      cursor: pointer;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .switch.on {
      background: var(--green-main);
    }
    .switch.on::after {
      transform: translateX(18px);
    }

    .powered-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      padding: 2px 6px 0;
    }

    /* MAIN GAME AREA */
    .main-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 14px calc(10px + var(--safe-bottom));
      gap: 10px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .game-viewport {
      flex: 1;
      min-height: 230px;
      background: #1b1f2d;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45);
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-badge {
      background: rgba(18, 21, 31, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-mult {
      color: var(--gold-main);
      font-size: 15px;
      font-weight: 900;
    }

    .toast-banner {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translate(-50%, -20px) scale(0.92);
      background: rgba(18, 21, 31, 0.94);
      border: 2px solid var(--gold-main);
      padding: 12px 22px;
      border-radius: 16px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 15;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
    }

    .toast-banner.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .toast-banner.lose {
      border-color: var(--red-main);
    }

    .toast-banner .title {
      font-family: 'Luckiest Guy', cursive;
      font-size: 24px;
      letter-spacing: 0.8px;
      color: var(--gold-main);
    }

    .toast-banner.lose .title {
      color: var(--red-main);
    }

    .toast-banner .sub {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    /* BET BAR */
    .bet-bar {
      flex-shrink: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 12px;
      display: grid;
      grid-template-columns: 1.35fr 0.85fr 1.1fr;
      gap: 12px;
      align-items: stretch;
    }

    .bet-input-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 4px;
      height: 44px;
    }

    .mini-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      background: #30364c;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .mini-btn:active {
      background: #3e4663;
    }

    .bet-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      text-align: center;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
    }

    .fast-bets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .fast-btn {
      height: 34px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .fast-btn:active {
      background: #3c435c;
    }

    .difficulty-block {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      position: relative;
    }

    .diff-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .diff-select-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      color: #fff;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .diff-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #2c3144;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      z-index: 45;
    }

    .diff-menu.open {
      display: flex;
    }

    .diff-option {
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diff-option:hover,
    .diff-option.active {
      background: rgba(40, 199, 111, 0.2);
      color: #7df3af;
    }

    .action-block {
      display: flex;
      gap: 8px;
    }

    .play-btn {
      flex: 1;
      min-height: 54px;
      border-radius: 12px;
      background: linear-gradient(180deg, #32dc7d 0%, #1da659 100%);
      box-shadow: 0 4px 0 #14773f, 0 8px 20px rgba(40, 199, 111, 0.3);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      transition: transform 0.08s ease;
    }

    .play-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #14773f;
    }

    .play-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cashout-btn {
      flex: 1;
      min-height: 54px;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffd038 0%, #e09100 100%);
      box-shadow: 0 4px 0 #9f6300, 0 8px 20px rgba(255, 184, 0, 0.3);
      color: #1c1400;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cashout-btn.show {
      display: flex;
    }

    /* LIVE WINS BAR */
    .live-wins-bar {
      flex-shrink: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow: hidden;
    }

    .live-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-main);
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--green-main);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .live-feed-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      min-width: 0;
      animation: slideInWin 0.32s ease;
    }

    @keyframes slideInWin {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .live-win-sum {
      color: var(--green-main);
      font-weight: 800;
      white-space: nowrap;
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 18, 0.78);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 85vh;
      max-height: 85dvh;
      background: #252938;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.55;
      color: #d6dbe8;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .avatar-choice {
      height: 64px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 2px solid transparent;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-choice.selected {
      border-color: var(--gold-main);
      background: rgba(255, 184, 0, 0.12);
    }

    .seed-box {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #8ce99a;
      margin: 6px 0 12px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--bg-input);
      margin-bottom: 6px;
      font-size: 12px;
    }

    .desktop-only {
      display: inline-flex;
    }
    .mobile-only {
      display: none;
    }

    @media (max-width: 820px) {
      .desktop-only {
        display: none;
      }
      .mobile-only {
        display: flex;
      }
      .header {
        padding: 0 10px;
        height: 52px;
      }
      .logo-badge {
        font-size: 18px;
      }
      .logo-badge span.two {
        font-size: 21px;
      }
      .main-layout {
        padding: 8px 10px calc(8px + var(--safe-bottom));
        gap: 8px;
      }
      .bet-bar {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px;
      }
      .difficulty-block {
        flex-direction: row;
        align-items: center;
      }
      .diff-label {
        font-size: 12px;
      }
      .diff-select-btn {
        min-height: 40px;
        max-width: 62%;
      }
      .play-btn,
      .cashout-btn {
        min-height: 48px;
      }
      .live-wins-bar {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- HEADER -->
    <header class="header">
      <div class="logo-wrap">
        <div class="logo-badge">
          🐔 CHICKEN ROAD <span class="two">2</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-how-to-play" class="pill-btn desktop-only" data-testid="menu-how-to-play">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.33C4.32 1.33 1.33 4.32 1.33 8C1.33 11.68 4.32 14.67 8 14.67C11.68 14.67 14.67 11.68 14.67 8C14.67 4.32 11.68 1.33 8 1.33ZM8 13.33C5.06 13.33 2.67 10.94 2.67 8C2.67 5.06 5.06 2.67 8 2.67C10.94 2.67 13.33 5.06 13.33 8C13.33 10.94 10.94 13.33 8 13.33Z" fill="white"/>
            <path d="M7.33 4.67H8.67V6H7.33V4.67ZM7.33 7.33H8.67V11.33H7.33V7.33Z" fill="white"/>
          </svg>
          <span>How to play?</span>
        </button>

        <button id="btn-balance" class="pill-btn balance-pill" data-testid="menu-balance" title="Tap to top up if low">
          <span id="balance-text">999 994.00</span>
          <span class="inr-coin">₹</span>
        </button>

        <button id="btn-fullscreen" class="pill-btn icon-btn" data-testid="menu-fullscreen" aria-label="Fullscreen">
          <svg width="14" height="14" viewBox="0 0 12 13" fill="none">
            <path d="M7.33 5.17L11.33 1.17M11.33 1.17H8.33M11.33 1.17V4.17M0.67 1.17L4.67 5.17M0.67 1.17V4.17M0.67 1.17H3.67M7.33 7.83L11.33 11.83M11.33 11.83V8.83M11.33 11.83H8.33M4.67 7.83L0.67 11.83M0.67 11.83H3.67M0.67 11.83V8.83" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

    function sha256Fallback(ascii) {

        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = "";
      const words = [];
      const asciiBitLength = ascii.length * 8;
      let hash = (sha256Fallback.h = sha256Fallback.h || []);
      let k = (sha256Fallback.k = sha256Fallback.k || []);
      let primeCounter = k.length;
      const isComposite = {};

      words[words.length] = (asciiBitLength / maxWord) | 0;

            k[i] +

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.soundOn = true;
        this.musicOn = false;
        this.musicTimer = null;
      }
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume().catch(() => {});
        }
      }
      tone(freq, dur, type = "sine", vol = 0.12, slideTo = null) {
        if (!this.soundOn || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      }

      { kind: "taxi", color: "#f5b700", trim: "#ffe896", h: 68 },
      { kind: "suv", color: "#3b82f6", trim: "#93c5fd", h: 74 },
      { kind: "van", color: "#9333ea", trim: "#d8b4fe", h: 82 },
      { kind: "sedan", color: "#14b8a6", trim: "#99f6e4", h: 68 },
    ];

    const anim = {
      time: 0,
      camX: 0,
      shake: 0,
      chickenX: SIDEWALK_W * 0.55,
      chickenHop: 0,
      hopFromX: SIDEWALK_W * 0.55,
      hopToX: SIDEWALK_W * 0.55,
      hopProgress: 1,
      crushed: false,
      crushTime: 0,
      crushLaneIdx: -1,
      skidProgress: 0,
      celebrateTime: 0,
      blinkTimer: 2.5,
      isBlinking: false,
      cars: [],
      barrierDrop: [],
      feathers: [],
      dust: [],
      lastTime: performance.now(),
    };

    function initRoadVisuals() {
      const total = DIFFICULTIES[state.difficulty].lanes;
      anim.cars = [];
      anim.barrierDrop = new Array(total).fill(0);
      for (let i = 0; i < total; i++) {
        const vType = VEHICLE_TYPES[(i * 3 + Math.floor(Math.random() * 5)) % VEHICLE_TYPES.length];
        anim.cars.push({
          ...vType,
          y: -110 - Math.random() * 260,
          speed: 145 + Math.random() * 145,
          braking: false,
          stopped: false,
          strikeMode: false,
          clearBelow: false,
        });
      }
    }
    initRoadVisuals();

    function spawnCrashEffects(x, y) {
      anim.shake = 14;
      for (let i = 0; i < 22; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 75 + Math.random() * 200;
        anim.feathers.push({
          x,
          y: y - 4,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 55,
          rot: Math.random() * 6,
          vrot: (Math.random() - 0.5) * 12,
          life: 1.35,
        });
      }
      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 35 + Math.random() * 90;
        anim.dust.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 8 + Math.random() * 13,
          life: 0.75,
        });
      }
    }

    function spawnLandingDust(x, y) {
      for (let i = 0; i < 6; i++) {
        const ang = Math.PI + (Math.random() - 0.5) * Math.PI;
        anim.dust.push({
          x: x + (Math.random() - 0.5) * 16,
          y: y + 18,
          vx: Math.cos(ang) * (25 + Math.random() * 40),
          vy: -10 - Math.random() * 20,
          r: 5 + Math.random() * 6,
          life: 0.45,
        });
      }
    }

    function resetRoadToStart(smoothReturn = false) {
      anim.hopFromX = smoothReturn ? anim.chickenX : SIDEWALK_W * 0.55;
      anim.hopToX = SIDEWALK_W * 0.55;
      if (!smoothReturn) {
        anim.chickenX = SIDEWALK_W * 0.55;
        anim.hopProgress = 1;
      } else {
        anim.hopProgress = 0;
      }
      anim.crushed = false;
      anim.crushTime = 0;
      anim.crushLaneIdx = -1;
      anim.skidProgress = 0;
      anim.celebrateTime = 0;
      anim.shake = 0;
      anim.feathers = [];
      anim.dust = [];
      initRoadVisuals();
    }

    function drawRoundRect(x, y, w, h, r) {
      const radius = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // =========================================================================
    // MANHOLE COVER
    // =========================================================================
    function drawManholeCover(cx, cy, multText, isCleared, isCurrent) {
      ctx.beginPath();
      ctx.arc(cx, cy, 35, 0, Math.PI * 2);
      ctx.fillStyle = "#191d28";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, 32, 0, Math.PI * 2);
      ctx.fillStyle = isCleared ? "#25493a" : "#3a4154";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isCleared ? "#28c76f" : "#56607a";
      ctx.stroke();

      ctx.save();
      ctx.strokeStyle = isCleared ? "rgba(125,243,175,0.22)" : "rgba(20,24,35,0.45)";
      ctx.lineWidth = 2;
      for (let a = 0; a < 8; a++) {
        const ang = (a * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * 21, cy + Math.sin(ang) * 21);
        ctx.lineTo(cx + Math.cos(ang) * 29, cy + Math.sin(ang) * 29);
        ctx.stroke();
      }
      ctx.restore();

      ctx.fillStyle = "#171a24";
      ctx.fillRect(cx - 31, cy - 3, 5, 6);
      ctx.fillRect(cx + 26, cy - 3, 5, 6);

      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.fillStyle = isCurrent
        ? "#ffb800"
        : isCleared
        ? "#1e7a48"
        : "#232838";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = isCleared ? "#5ef09b" : "#ffb800";
      ctx.stroke();

      ctx.fillStyle = isCurrent ? "#1a1200" : isCleared ? "#ffffff" : "#ffd34e";
      ctx.font = "800 11px Montserrat, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(multText, cx, cy + 0.5);
      ctx.textBaseline = "alphabetic";
    }

    // =========================================================================
    // BARRIER
    // =========================================================================
    function drawBarrier(cx, barrierY, dropProgress) {
      if (dropProgress <= 0) return;
      const ease = 1 - Math.pow(1 - dropProgress, 3);
      const liftY = (1 - ease) * -36;
      const scale = 0.8 + ease * 0.2;

      ctx.save();
      ctx.translate(cx, barrierY + liftY);
      ctx.scale(scale, scale);

      ctx.fillStyle = `rgba(0,0,0,${0.38 * ease})`;
      drawRoundRect(-36, 12, 72, 9, 4);
      ctx.fill();

      ctx.fillStyle = "#94a3b8";
      ctx.fillRect(-26, -6, 5, 22);
      ctx.fillRect(21, -6, 5, 22);

      ctx.fillStyle = "#ea580c";
      drawRoundRect(-33, 12, 16, 6, 2);
      ctx.fill();
      drawRoundRect(17, 12, 16, 6, 2);
      ctx.fill();

      ctx.save();
      drawRoundRect(-36, -15, 72, 18, 5);
      ctx.clip();

      ctx.fillStyle = "#e11d48";
      ctx.fillRect(-36, -15, 72, 18);

      ctx.fillStyle = "#ffffff";
      for (let sx = -48; sx < 48; sx += 16) {
        ctx.beginPath();
        ctx.moveTo(sx, -15);
        ctx.lineTo(sx + 8, -15);
        ctx.lineTo(sx + 1, 3);
        ctx.lineTo(sx - 7, 3);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "#1f2433";
      drawRoundRect(-36, -15, 72, 18, 5);
      ctx.stroke();

      ctx.fillStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.arc(-24, -6, 2, 0, Math.PI * 2);
      ctx.arc(24, -6, 2, 0, Math.PI * 2);
      ctx.fill();

      const flash = Math.sin(anim.time * 10) > 0 ? 1 : 0.45;
      [-23, 23].forEach((bx) => {
        ctx.fillStyle = "#334155";
        ctx.fillRect(bx - 4, -20, 8, 5);
        ctx.beginPath();
        ctx.arc(bx, -23, 5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 190, 11, ${flash})`;
        ctx.fill();
        if (flash > 0.8) {
          ctx.beginPath();
          ctx.arc(bx, -23, 10, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 190, 11, 0.28)";
          ctx.fill();
        }
      });

      ctx.restore();
    }

    // =========================================================================
    // VEHICLE RENDERER
    // =========================================================================
    function drawVehicle(cx, car) {
      const carW = 52;
      const carX = cx - carW / 2;
      const carY = car.y;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      drawRoundRect(carX - 3, carY + 5, carW + 6, car.h, 12);
      ctx.fill();

      const grad = ctx.createLinearGradient(cx, carY + car.h, cx, carY + car.h + 44);
      grad.addColorStop(0, "rgba(255, 245, 175, 0.32)");
      grad.addColorStop(1, "rgba(255, 245, 175, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(carX + 6, carY + car.h - 2);
      ctx.lineTo(carX - 8, carY + car.h + 44);
      ctx.lineTo(carX + 24, carY + car.h + 44);
      ctx.lineTo(carX + 18, carY + car.h - 2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(carX + carW - 18, carY + car.h - 2);
      ctx.lineTo(carX + carW - 24, carY + car.h + 44);
      ctx.lineTo(carX + carW + 8, carY + car.h + 44);
      ctx.lineTo(carX + carW - 6, carY + car.h - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#111827";
      ctx.fillRect(carX - 3, carY + 10, 5, 13);
      ctx.fillRect(carX + carW - 2, carY + 10, 5, 13);
      ctx.fillRect(carX - 3, carY + car.h - 22, 5, 13);
      ctx.fillRect(carX + carW - 2, carY + car.h - 22, 5, 13);

      ctx.fillStyle = car.color;
      drawRoundRect(carX, carY, carW, car.h, 11);
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.stroke();

      if (car.kind === "sports") {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cx - 5, carY + 2, 4, car.h - 4);
        ctx.fillRect(cx + 1, carY + 2, 4, car.h - 4);
      }

      ctx.fillStyle = "#172033";
      drawRoundRect(carX + 6, carY + 12, carW - 12, car.h - 26, 7);
      ctx.fill();

      ctx.fillStyle = car.trim;
      drawRoundRect(carX + 9, carY + 18, carW - 18, car.h - 40, 5);
      ctx.fill();

      if (car.kind === "taxi") {
        ctx.fillStyle = "#111";
        drawRoundRect(cx - 10, carY + 24, 20, 8, 2);
        ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.font = "900 6px Montserrat, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("TAXI", cx, carY + 30);
      }

      ctx.fillStyle = "#fff9b1";
      drawRoundRect(carX + 6, carY + car.h - 5, 10, 4, 2);
      ctx.fill();
      drawRoundRect(carX + carW - 16, carY + car.h - 5, 10, 4, 2);
      ctx.fill();

      ctx.fillStyle = car.braking ? "#ff1f1f" : "#991b1b";
      drawRoundRect(carX + 6, carY + 1, 10, 4, 2);
      ctx.fill();
      drawRoundRect(carX + carW - 16, carY + 1, 10, 4, 2);
      ctx.fill();
    }

    // =========================================================================
    // CRUSHED CHICKEN + TIRE MARKS + DEAD EYE RENDERER
    // =========================================================================
    function drawTireSkidMarks(x, baseY) {
      const startY = Math.max(0, baseY - 120);
      const endY = Math.min(ch, startY + (baseY - startY + 150) * anim.skidProgress);

      [-15, 15].forEach((offset) => {
        ctx.fillStyle = "rgba(12, 14, 20, 0.72)";
        ctx.fillRect(x + offset - 5, startY, 10, Math.max(0, endY - startY));
        // Tire tread pattern
        ctx.fillStyle = "rgba(40, 44, 58, 0.5)";
        for (let ty = startY; ty < endY; ty += 12) {
          ctx.fillRect(x + offset - 4, ty, 8, 4);
        }
      });
    }

    function drawCrushedChicken(x, baseY) {
      const squish = Math.min(1, anim.crushTime * 10);
      const scaleX = 1 + 0.45 * squish;
      const scaleY = 1 - 0.58 * squish;

      ctx.save();
      ctx.translate(x, baseY + 12);
      ctx.scale(scaleX, scaleY);

      // Splayed flattened orange legs sticking out sideways
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-18, 2);
      ctx.lineTo(-32, 10);
      ctx.moveTo(18, 2);
      ctx.lineTo(32, 10);
      ctx.stroke();

      // Flattened oval body splat
      ctx.beginPath();
      ctx.ellipse(0, 2, 26, 15, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#cbd5e1";
      ctx.stroke();

      // Crushed red comb & wattle
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(-8, -11, 5, 0, Math.PI * 2);
      ctx.arc(-1, -13, 5.5, 0, Math.PI * 2);
      ctx.arc(6, -10, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // Squashed orange beak & tongue hanging out
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.moveTo(18, -5);
      ctx.lineTo(31, -2);
      ctx.lineTo(18, 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fb7185";
      ctx.beginPath();
      ctx.ellipse(24, 5, 4.5, 3, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Tire tread marks stamped right across the crushed chicken!
      ctx.fillStyle = "rgba(18, 20, 28, 0.78)";
      ctx.fillRect(-14, -14, 7, 32);
      ctx.fillRect(7, -14, 7, 32);
      ctx.fillStyle = "rgba(255,255,255,0.16)";
      for (let ty = -10; ty < 14; ty += 7) {
        ctx.fillRect(-13, ty, 5, 2.5);
        ctx.fillRect(8, ty, 5, 2.5);
      }

      // Big Dead 'X' Eye
      ctx.beginPath();
      ctx.arc(11, -5, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#64748b";
      ctx.stroke();

      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(8, -8);
      ctx.lineTo(14, -2);
      ctx.moveTo(14, -8);
      ctx.lineTo(8, -2);
      ctx.stroke();

      ctx.restore();

      // Orbiting dizzy stars above crushed chicken
      for (let s = 0; s < 3; s++) {
        const ang = anim.time * 4.5 + (s * Math.PI * 2) / 3;
        const sx = x + Math.cos(ang) * 26;
        const sy = baseY - 12 + Math.sin(ang) * 7;
        ctx.fillStyle = "#fde047";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("★", sx, sy);
      }
    }

    // =========================================================================
    // REAL ANIMATED CHICKEN HERO RENDERER
    // =========================================================================
    function drawRealChicken(x, baseY) {
      if (anim.crushed) {
        drawTireSkidMarks(x, baseY);
        drawCrushedChicken(x, baseY);
        return;
      }

      const isHopping = anim.hopProgress < 1;
      const hopT = anim.hopProgress;
      const breathe = isHopping ? 0 : Math.sin(anim.time * 4.5) * 1.8;
      const wingFlap = isHopping
        ? Math.sin(hopT * Math.PI * 4) * 0.55
        : anim.celebrateTime > 0
        ? Math.sin(anim.time * 18) * 0.6
        : Math.sin(anim.time * 3) * 0.08;

      const celebrateBob = anim.celebrateTime > 0 ? Math.abs(Math.sin(anim.time * 12)) * 12 : 0;
      const y = baseY - anim.chickenHop - celebrateBob;

      const shadowScale = Math.max(0.45, 1 - (anim.chickenHop + celebrateBob) / 80);
      ctx.beginPath();
      ctx.ellipse(x, baseY + 22, 20 * shadowScale, 7 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.42)";
      ctx.fill();

      ctx.save();
      ctx.translate(x, y);

      if (isHopping) {
        const stretch = Math.sin(hopT * Math.PI) * 0.16;
        ctx.scale(1 - stretch * 0.6, 1 + stretch);
      } else {
        ctx.scale(1, 1 - breathe * 0.015);
      }

      // Legs & feet
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      const legKick = isHopping ? Math.sin(hopT * Math.PI) * 7 : 0;
      ctx.beginPath();
      ctx.moveTo(-5, 12);
      ctx.lineTo(-7 - legKick * 0.5, 21 - legKick * 0.4);
      ctx.lineTo(-1, 22 - legKick * 0.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(6, 12);
      ctx.lineTo(7 + legKick * 0.4, 21 - legKick * 0.4);
      ctx.lineTo(14 + legKick * 0.4, 22 - legKick * 0.4);
      ctx.stroke();

      // Tail feathers
      ctx.fillStyle = "#f1f5f9";
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1.6;
      [-0.4, -0.1, 0.25].forEach((ang, idx) => {
        ctx.save();
        ctx.translate(-17, -2 + idx * 3);
        ctx.rotate(ang + Math.sin(anim.time * 6 + idx) * 0.06);
        ctx.beginPath();
        ctx.ellipse(-7, 0, 10, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Body
      ctx.beginPath();
      ctx.ellipse(-2, 2, 21, 17, -0.08, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#cbd5e1";
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-1, 8, 16, 9, 0, 0, Math.PI);
      ctx.fillStyle = "#f1f5f9";
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(8, -13, 13.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 3-Lobed Red Comb
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(2, -26, 4.8, 0, Math.PI * 2);
      ctx.arc(8, -28.5, 5.5, 0, Math.PI * 2);
      ctx.arc(14, -25, 4.4, 0, Math.PI * 2);
      ctx.fill();

      // Wattle
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.ellipse(17, -5, 3.6, 5.2, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.moveTo(19, -15);
      ctx.quadraticCurveTo(30, -13, 30, -10);
      ctx.lineTo(19, -9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#d97706";
      ctx.beginPath();
      ctx.moveTo(19, -9);
      ctx.lineTo(27, -9);
      ctx.quadraticCurveTo(25, -6, 19, -7);
      ctx.closePath();
      ctx.fill();

      // Blinking Eye
      if (anim.isBlinking) {
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(8, -15);
        ctx.lineTo(16, -15);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(12, -15, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = "#94a3b8";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(13.2, -15, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#0f172a";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(14, -16, 0.9, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
      }

      // Flapping Wing
      ctx.save();
      ctx.translate(-3, 0);
      ctx.rotate(wingFlap);
      ctx.beginPath();
      ctx.ellipse(-2, 3, 11, 7, -0.25, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "#cbd5e1";
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // =========================================================================
    // MAIN RENDER LOOP (60-120FPS DELTA-TIME + SYNCHRONIZED CRASH)
    // =========================================================================
    function renderLoop(now) {
      const dt = Math.min(0.05, (now - anim.lastTime) / 1000);
      anim.lastTime = now;
      anim.time += dt;

      anim.blinkTimer -= dt;
      if (anim.blinkTimer <= 0) {
        anim.isBlinking = !anim.isBlinking;
        anim.blinkTimer = anim.isBlinking ? 0.12 : 2.2 + Math.random() * 2.5;
      }

      if (anim.crushed) {
        anim.crushTime += dt;
        anim.skidProgress = Math.min(1, anim.skidProgress + dt * 5.5);
      }
      if (anim.celebrateTime > 0) anim.celebrateTime = Math.max(0, anim.celebrateTime - dt);
      if (anim.shake > 0) anim.shake = Math.max(0, anim.shake - dt * 32);

      const mults = getMultipliers(state.difficulty);
      const totalLanes = mults.length;
      const chickenBaseY = ch * 0.56;
      const barrierY = chickenBaseY - 64;

      if (anim.hopProgress < 1) {
        anim.hopProgress = Math.min(1, anim.hopProgress + dt * 4.3);
        const t = anim.hopProgress;
        anim.chickenX = anim.hopFromX + (anim.hopToX - anim.hopFromX) * t;
        anim.chickenHop = Math.sin(t * Math.PI) * 34;
      } else {
        anim.chickenHop = 0;
      }

      const targetCam = Math.max(0, anim.chickenX - cw * 0.34);
      const maxCam = Math.max(0, SIDEWALK_W * 2 + totalLanes * LANE_W - cw);
      anim.camX += (Math.min(targetCam, maxCam) - anim.camX) * Math.min(1, dt * 8);

      // Update barrier drops & lane cars
      for (let i = 0; i < totalLanes; i++) {
        const isCleared = i < state.currentStep && state.status !== "crashed";
        if (isCleared && anim.barrierDrop[i] < 1) {
          anim.barrierDrop[i] = Math.min(1, anim.barrierDrop[i] + dt * 6.5);
        }

        const c = anim.cars[i];
        if (!c) continue;

        if (c.strikeMode) {
          // Speeding car physically blasts right over the chicken and off-screen
          c.y += 940 * dt;
          if (!anim.crushed && c.y + c.h >= chickenBaseY - 12) {
            anim.crushed = true;
            anim.crushTime = 0;
            anim.skidProgress = 0.25;
            spawnCrashEffects(anim.chickenX, chickenBaseY);
            audio.crash();
          }
          if (c.y > ch + 150) c.strikeMode = false;
        } else if (c.clearBelow) {
          // Safe lane: car already past barrier accelerates cleanly past bottom so it NEVER crosses chicken
          c.braking = false;
          c.y += 680 * dt;
          if (c.y > ch + 100) {
            c.clearBelow = false;
            c.y = -c.h - 140;
          }
        } else if (isCleared) {
          // Safe lane: brake cleanly behind barrier
          const stopLine = barrierY - c.h - 24;
          if (c.y <= stopLine + 6) {
            c.braking = true;
            if (c.y < stopLine) {
              c.y = Math.min(stopLine, c.y + c.speed * 0.7 * dt);
            } else {
              c.stopped = true;
            }
          } else {
            // Already below chicken
            c.braking = false;
            c.y += c.speed * dt;
          }
        } else {
          // Normal unvisited lane traffic
          c.braking = false;
          c.stopped = false;
          c.y += c.speed * dt;
          if (c.y > ch + 50) c.y = -c.h - 40 - Math.random() * 140;
        }
      }

      // Feathers & Dust
      for (let i = anim.feathers.length - 1; i >= 0; i--) {
        const f = anim.feathers[i];
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vy += 260 * dt;
        f.rot += f.vrot * dt;
        f.life -= dt * 0.9;
        if (f.life <= 0) anim.feathers.splice(i, 1);
      }
      for (let i = anim.dust.length - 1; i >= 0; i--) {
        const d = anim.dust[i];
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        d.r += dt * 14;
        d.life -= dt * 1.4;
        if (d.life <= 0) anim.dust.splice(i, 1);
      }

      ctx.fillStyle = "#1c202e";
      ctx.fillRect(0, 0, cw, ch);

      ctx.save();
      const shakeX = anim.shake > 0 ? (Math.random() - 0.5) * anim.shake : 0;
      const shakeY = anim.shake > 0 ? (Math.random() - 0.5) * anim.shake : 0;
      ctx.translate(-anim.camX + shakeX, shakeY);

      // Start Sidewalk
      ctx.fillStyle = "#48516b";
      ctx.fillRect(0, 0, SIDEWALK_W, ch);
      ctx.fillStyle = "#626d8d";
      ctx.fillRect(SIDEWALK_W - 10, 0, 10, ch);
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      for (let sy = 20; sy < ch; sy += 44) {
        ctx.fillRect(SIDEWALK_W - 38, sy, 22, 22);
      }

      // Asphalt Road
      const totalRoadW = totalLanes * LANE_W;
      ctx.fillStyle = "#282d3c";
      ctx.fillRect(SIDEWALK_W, 0, totalRoadW, ch);

      // Finish Sidewalk
      const finishX = SIDEWALK_W + totalRoadW;
      ctx.fillStyle = "#3f4c3f";
      ctx.fillRect(finishX, 0, SIDEWALK_W + 100, ch);
      ctx.fillStyle = "#5b6d5b";
      ctx.fillRect(finishX, 0, 10, ch);

      ctx.beginPath();
      ctx.arc(finishX + 66, chickenBaseY + 6, 30, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 184, 0, 0.22)";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "#ffb800";
      ctx.stroke();
      ctx.font = "34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🥚", finishX + 66, chickenBaseY + 16);

      // Manholes, Barriers & Lanes (drawn under chicken)
      for (let i = 0; i < totalLanes; i++) {
        const lx = SIDEWALK_W + i * LANE_W;
        if (lx + LANE_W < anim.camX - 60 || lx > anim.camX + cw + 60) continue;

        if (i > 0) {
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.lineWidth = 3;
          ctx.setLineDash([16, 14]);
          ctx.beginPath();
          ctx.moveTo(lx, 0);
          ctx.lineTo(lx, ch);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        const cx = lx + LANE_W * 0.5;
        const isCleared = i < state.currentStep && state.status !== "crashed";
        const isCurrent = i === state.currentStep - 1 && state.status !== "crashed";

        drawManholeCover(cx, chickenBaseY + 8, `${mults[i].toFixed(2)}x`, isCleared, isCurrent);

        if (isCleared) {
          drawBarrier(cx, barrierY, anim.barrierDrop[i]);
        }
      }

      // Dust puffs
      for (const d of anim.dust) {
        ctx.globalAlpha = Math.max(0, d.life * 0.55);
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Chicken (drawn before strike car so car physically runs OVER the chicken)
      drawRealChicken(anim.chickenX, chickenBaseY);

      // Vehicles (drawn on top so a strike car physically crushes over the chicken)
      for (let i = 0; i < totalLanes; i++) {
        const lx = SIDEWALK_W + i * LANE_W;
        if (lx + LANE_W < anim.camX - 60 || lx > anim.camX + cw + 60) continue;
        const cx = lx + LANE_W * 0.5;
        const car = anim.cars[i];
        if (car && car.y < ch + 110 && car.y > -car.h - 140) {
          drawVehicle(cx, car);
        }
      }

      // Flying Feathers
      for (const f of anim.feathers) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      ctx.restore();
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // =========================================================================
    // 9. ROUND LOGIC (CLEAN CASHOUT RESET + SYNCED CRASH)
    // =========================================================================
    async function generateLaneOutcomes() {
      const cfg = DIFFICULTIES[state.difficulty];
      const safeMap = [];
      for (let i = 0; i < cfg.lanes; i++) {
        const hex = await sha256Hex(`${state.serverSeed}:${state.clientSeed}:${state.nonce}:${i}`);
        const num = parseInt(hex.slice(0, 8), 16) / 0x100000000;
        safeMap.push(num >= cfg.crashProb);
      }
      return safeMap;
    }

    function parseBet() {
      let val = parseFloat(elBetInput.value.replace(",", "."));
      if (isNaN(val)) val = window.env.MIN_BET;
      val = Math.max(window.env.MIN_BET, Math.min(window.env.MAX_BET, val));
      elBetInput.value = val;
      state.bet = val;
      return val;
    }

    async function startNewRound() {
      const bet = parseBet();
      if (bet > state.balance) {
        showToast("LOW BALANCE", "Tap balance to refill demo credits", true);
        return;
      }

      state.roundToken += 1;
      state.balance = Number((state.balance - bet).toFixed(2));
      state.currentStep = 0;
      state.currentMult = 1.0;
      state.serverSeed = randomHex(32);
      state.serverSeedHash = await sha256Hex(state.serverSeed);
      state.nonce += 1;
      state.laneSafeMap = await generateLaneOutcomes();

      resetRoadToStart(false);
      updateUI();
      await stepForward();
    }

    async function stepForward() {
      if (state.status === "hopping") return;
      const myToken = state.roundToken;
      state.status = "hopping";
      updateUI();
      audio.hop();

      const nextIndex = state.currentStep;
      const targetX = SIDEWALK_W + nextIndex * LANE_W + LANE_W * 0.5;
      anim.hopFromX = anim.chickenX;
      anim.hopToX = targetX;
      anim.hopProgress = 0;

      const isSafe = state.laneSafeMap[nextIndex];
      const car = anim.cars[nextIndex];
      const chickenBaseY = ch * 0.56;
      const barrierY = chickenBaseY - 64;

      if (!isSafe && car) {
        // Position speeding crash car so it slams right into the chicken at landing
        car.y = chickenBaseY - car.h - 215;
        car.strikeMode = true;
      } else if (isSafe && car) {
        // Ensure no ambient car in a safe lane ever overlaps the chicken
        if (car.y + car.h > barrierY - 12 && car.y < chickenBaseY + 45) {
          car.clearBelow = true;
        }
      }

      await new Promise((r) => setTimeout(r, 255));
      if (myToken !== state.roundToken) return;

      const mults = getMultipliers(state.difficulty);

      if (!isSafe) {
        state.status = "crashed";
        anim.crushLaneIdx = nextIndex;
        if (!anim.crushed) {
          anim.crushed = true;
          anim.crushTime = 0;
          anim.skidProgress = 0.25;
          spawnCrashEffects(targetX, chickenBaseY);
          audio.crash();
        }
        showToast("CRASHED!", `-₹${state.bet.toFixed(2)}`, true);

        state.history.unshift({
          time: new Date().toLocaleTimeString(),
          diff: DIFFICULTIES[state.difficulty].label,
          bet: state.bet,
          mult: 0,
          payout: 0,
          win: false,
        });
        syncFirebaseProfile();
        updateUI();
        return;
      }

      // Safe landing
      spawnLandingDust(targetX, chickenBaseY);
      state.currentStep += 1;
      state.currentMult = mults[state.currentStep - 1];
      audio.safe();

      if (state.currentStep >= mults.length) {
        await cashOut();
      } else {
        state.status = "waiting";
        updateUI();
      }
    }

    async function cashOut() {
      if (state.status !== "waiting" && state.status !== "hopping") return;
      const myToken = state.roundToken;
      const payout = Math.min(window.env.MAX_WIN, Number((state.bet * state.currentMult).toFixed(2)));
      state.balance = Number((state.balance + payout).toFixed(2));
      state.status = "won";
      anim.celebrateTime = 0.85;

      audio.cashout();
      showToast(`${state.currentMult.toFixed(2)}x WIN!`, `+₹${payout.toFixed(2)}`, false);

      state.history.unshift({
        time: new Date().toLocaleTimeString(),
        diff: DIFFICULTIES[state.difficulty].label,
        bet: state.bet,
        mult: state.currentMult,
        payout,
        win: true,
      });

      updateUI();
      syncFirebaseProfile();
      pushLiveWinToFirebase(payout);

      // Automatically clear barriers, reset lane/mult, and return chicken to start sidewalk
      setTimeout(() => {
        if (myToken !== state.roundToken || state.status !== "won") return;
        state.status = "idle";
        state.currentStep = 0;
        state.currentMult = 1.0;
        resetRoadToStart(true);
        updateUI();
      }, 850);
    }

    // =========================================================================
    // 10. EVENT LISTENERS
    // =========================================================================
    elPlayBtn.addEventListener("click", () => {
      audio.unlock();
      if (state.status === "waiting") {
        stepForward();
      } else if (state.status !== "hopping") {
        startNewRound();
      }
    });

    elCashoutBtn.addEventListener("click", () => {
      audio.unlock();
      if (state.status === "waiting") cashOut();
    });

    document.getElementById("btn-min").addEventListener("click", () => {
      if (state.status === "waiting" || state.status === "hopping") return;
      elBetInput.value = window.env.MIN_BET;
      parseBet();
    });

    document.getElementById("btn-max").addEventListener("click", () => {
      if (state.status === "waiting" || state.status === "hopping") return;
      elBetInput.value = Math.min(window.env.MAX_BET, Math.floor(state.balance));
      parseBet();
    });

    document.querySelectorAll(".fast-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (state.status === "waiting" || state.status === "hopping") return;
        elBetInput.value = btn.dataset.val;
        parseBet();
      });
    });

    elBetInput.addEventListener("change", parseBet);

    document.getElementById("btn-balance").addEventListener("click", () => {
      if (state.balance < 10) {
        state.balance = 10000;
        updateUI();
        syncFirebaseProfile();
        showToast("TOP UP!", "+₹10,000 Demo Credits");
      }
    });

    const diffBtn = document.getElementById("diff-select-btn");
    const diffMenu = document.getElementById("diff-menu");
    diffBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (state.status === "waiting" || state.status === "hopping") return;
      diffMenu.classList.toggle("open");
    });

    document.querySelectorAll(".diff-option").forEach((opt) => {
      opt.addEventListener("click", () => {
        state.difficulty = opt.dataset.diff;
        document.getElementById("diff-current-label").textContent = DIFFICULTIES[state.difficulty].label;
        document.querySelectorAll(".diff-option").forEach((o) => o.classList.remove("active"));
        opt.classList.add("active");
        diffMenu.classList.remove("open");
        if (state.status !== "waiting") {
          state.status = "idle";
          state.currentStep = 0;
          state.currentMult = 1.0;
          resetRoadToStart(false);
          updateUI();
        }
      });
    });

    const menuEl = document.getElementById("menu-container");
    document.getElementById("btn-burger").addEventListener("click", (e) => {
      e.stopPropagation();
      menuEl.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!menuEl.contains(e.target)) menuEl.classList.remove("open");
      if (!diffMenu.contains(e.target) && e.target !== diffBtn) diffMenu.classList.remove("open");
    });

    document.getElementById("sound-switch").addEventListener("click", () => {
      audio.unlock();
      audio.soundOn = !audio.soundOn;
      document.getElementById("toggle-sound").classList.toggle("on", audio.soundOn);
    });

    document.getElementById("music-switch").addEventListener("click", () => {
      audio.unlock();
      const next = !audio.musicOn;
      audio.setMusic(next);
      document.getElementById("toggle-music").classList.toggle("on", next);
    });

    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      const docEl = document.documentElement;
      if (!document.fullscreenElement) {
        (docEl.requestFullscreen || docEl.webkitRequestFullscreen)?.call(docEl);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    });

    // =========================================================================
    // 11. MODALS (INR)
    // =========================================================================
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    function openModal(title, html) {
      menuEl.classList.remove("open");
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalBackdrop.classList.add("open");
    }

    document.getElementById("modal-close").addEventListener("click", () => {
      modalBackdrop.classList.remove("open");
    });
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
    });

    function openHowToPlay() {
      openModal(
        "How to play?",
        `
        <p><strong>1. Set your bet</strong> using the input, MIN/MAX, or quick bet buttons (50 ₹, 100 ₹, 500 ₹).</p>
        <p><strong>2. Pick a difficulty</strong>: <em>Easy</em> (24 lanes), <em>Medium</em> (22 lanes), <em>Hard</em> (20 lanes), or <em>Hardcore</em> (18 lanes). Higher difficulty gives bigger multipliers.</p>
        <p><strong>3. Tap Play & Go</strong> to hop from manhole cover to manhole cover. Safe lanes drop a road barrier to stop traffic.</p>
        <p><strong>4. Cash Out anytime</strong> before a car crushes the chicken to collect your ₹ winnings—or reach the Golden Egg!</p>
      `
      );
    }

    document.getElementById("btn-how-to-play").addEventListener("click", openHowToPlay);
    document.getElementById("btn-how-mobile").addEventListener("click", openHowToPlay);

    document.getElementById("btn-change-avatar").addEventListener("click", () => {
      const grid = AVATARS.map(
        (av) =>
          `<button class="avatar-choice ${av === state.avatar ? "selected" : ""}" data-av="${av}">${av}</button>`
      ).join("");
      openModal(
        "Change Avatar & Name",
        `
        <label style="font-size:12px;color:#9ca3b8;font-weight:700;">Player Name</label>
        <input id="input-username" value="${state.username}" maxlength="24" style="width:100%;margin-top:6px;margin-bottom:12px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#1c202c;color:#fff;font-weight:700;" />
        <div class="avatar-grid">${grid}</div>
      `
      );
      modalBody.querySelectorAll(".avatar-choice").forEach((b) => {
        b.addEventListener("click", () => {
          state.avatar = b.dataset.av;
          modalBody.querySelectorAll(".avatar-choice").forEach((x) => x.classList.remove("selected"));
          b.classList.add("selected");
          updateUI();
          syncFirebaseProfile();
        });
      });
      document.getElementById("input-username").addEventListener("change", (e) => {
        if (e.target.value.trim()) {
          state.username = e.target.value.trim();
          state.nameEditedByUser = true;
          updateUI();
          syncFirebaseProfile();
        }
      });
    });

    document.getElementById("btn-fair").addEventListener("click", async () => {
      if (!state.serverSeedHash) state.serverSeedHash = await sha256Hex(state.serverSeed);
      openModal(
        "Provably Fair Settings",
        `
        <p>Every round outcome is generated deterministically from <code>SHA256(serverSeed:clientSeed:nonce:lane)</code>.</p>
        <div><strong>Client Seed</strong></div>
        <div class="seed-box" id="fair-client">${state.clientSeed}</div>
        <div><strong>Current Server Seed (SHA-256 Hash)</strong></div>
        <div class="seed-box">${state.serverSeedHash}</div>
        <div><strong>Nonce:</strong> ${state.nonce}</div>
        <button id="btn-regen-seed" style="margin-top:12px;padding:10px 14px;border-radius:8px;background:#28c76f;color:#fff;font-weight:800;">
          Randomize Client Seed
        </button>
      `
      );
      document.getElementById("btn-regen-seed").addEventListener("click", () => {
        state.clientSeed = randomHex(16);
        document.getElementById("fair-client").textContent = state.clientSeed;
        saveLocal();
      });
    });

    document.getElementById("btn-rules").addEventListener("click", () => {
      openModal(
        "Game Rules & Limits",
        `
        <p><strong>Currency:</strong> Indian Rupees (INR ₹)<br>
           <strong>RTP (Return to Player):</strong> ${(window.env.RTP_VALUE * 100).toFixed(1)}%</p>
        <p><strong>Min Bet:</strong> ₹${window.env.MIN_BET.toFixed(2)}<br>
           <strong>Max Bet:</strong> ₹${window.env.MAX_BET.toLocaleString()}<br>
           <strong>Max Win per Round:</strong> ₹${window.env.MAX_WIN.toLocaleString()}</p>
        <p><strong>Modes:</strong><br>
          • Easy: 24 lanes (8% hazard/lane)<br>
          • Medium: 22 lanes (18% hazard/lane)<br>
          • Hard: 20 lanes (30% hazard/lane)<br>
          • Hardcore: 18 lanes (45% hazard/lane)
        </p>
      `
      );
    });

    document.getElementById("btn-history").addEventListener("click", () => {
      const rows = state.history.length
        ? state.history
            .map(
              (h) => `
          <div class="history-row">
            <div>
              <strong>${h.diff}</strong> · ₹${h.bet.toFixed(2)}
              <div style="color:#9ca3b8;font-size:11px;">${h.time}</div>
            </div>
            <div style="text-align:right;font-weight:800;color:${h.win ? "#28c76f" : "#ff4d4f"}">
              ${h.win ? `+ ₹${h.payout.toFixed(2)} (${h.mult.toFixed(2)}x)` : "CRASH"}
            </div>
          </div>`
            )
            .join("")
        : "<p>No rounds played yet.</p>";
      openModal("My Bet History", rows);
    });

    // =========================================================================
    // 12. LIVE WINS TICKER (INR) + ONLINE COUNT
    // =========================================================================
    const SIM_USERS = [
      ["🇮🇳", "AaravKing77", 420.5],
      ["🇮🇳", "LuckyRooster", 164.2],
      ["🇮🇳", "DesiChickenPro", 915.0],
      ["🇮🇳", "RohanWinner", 239.6],
      ["🇮🇳", "VihaanGold", 580.0],
    ];

    function showLiveWin(flag, user, sum) {
      const feed = document.getElementById("live-feed-item");
      feed.style.animation = "none";
      void feed.offsetHeight;
      feed.style.animation = "slideInWin 0.32s ease";
      feed.innerHTML = `
        <span>${flag}</span>
        <span>${user}</span>
        <span class="live-win-sum">+₹${Number(sum).toFixed(2)}</span>
      `;
    }

    setInterval(() => {
      const online = 5980 + Math.floor(Math.random() * 220);
      document.getElementById("online-count").textContent = online;
      if (!state.firebaseConnected) {
        const pick = SIM_USERS[Math.floor(Math.random() * SIM_USERS.length)];
        const jitter = pick[2] * (0.6 + Math.random() * 0.9);
        showLiveWin(pick[0], pick[1], jitter);
      }
    }, 3500);

    // Boot
    updateUI();
    initFirebase();
  </script>
</body>
