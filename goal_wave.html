<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Goal Wave</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 20%, rgba(45,164,90,0.15), transparent 40%), 
                        radial-gradient(circle at 80% 80%, rgba(0,255,150,0.08), transparent 45%);
        }
        .bg-wave-pattern {
            background: linear-gradient(to bottom, #0e4c25, #063117);
            position: relative;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @media (min-width: 640px) {
            .app-container {
                height: 880px;
                max-height: 92vh;
                border-radius: 36px;
                border: 8px solid rgba(255, 255, 255, 0.12);
            }
        }
        .glass-modal {
            background: rgba(10, 26, 16, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 25px rgba(234,179,8,0.25);
        }
        .tactile-btn {
            position: relative; overflow: hidden; transform: translateZ(0);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease, filter 0.15s ease;
            cursor: pointer; -webkit-user-select: none; user-select: none;
        }
        .tactile-btn:hover { filter: brightness(1.05); }
        .tactile-btn:active { transform: scale(0.94) translateY(1px) !important; }
        .ripple {
            position: absolute; background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%; transform: scale(0); animation: rippleEffect 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none;
        }
        @keyframes rippleEffect {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="bg-wave-pattern pt-4 px-4 pb-4 text-white relative flex-shrink-0 shadow-md border-b border-emerald-800/50">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <button onclick="window.location.href='games.html'" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white text-xs hover:bg-white/30 transition-all tactile-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h1 class="text-sm font-black tracking-tight">Goal Wave (Penalty Shootout)</h1>
                </div>
                <span class="text-[9px] bg-yellow-400 text-gray-950 font-bold px-2 py-0.5 rounded-full uppercase shadow">Live</span>
            </div>

            <!-- Gaming Wallet Card -->
            <div class="bg-black/40 border border-emerald-500/30 rounded-xl p-2.5 flex justify-between items-center backdrop-blur-sm">
                <div>
                    <span class="text-[9px] text-emerald-200 uppercase tracking-wider block font-semibold">Gaming Balance</span>
                    <span class="text-base font-black text-white font-mono" id="game-wallet-balance">₹0.00</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-yellow-300 font-mono font-bold" id="live-multiplier">Multiplier: 1.0x</span>
                </div>
            </div>
        </header>

        <!-- Main Canvas Game View -->
        <main class="flex-1 relative z-10 flex flex-col justify-between overflow-hidden bg-slate-950">
            
            <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden">
                <canvas id="gameCanvas" class="w-full h-full object-cover"></canvas>
                
                <!-- Overlay instructions badge -->
                <div class="absolute top-3 left-3 bg-black/60 border border-emerald-500/20 px-3 py-1.5 rounded-xl backdrop-blur-md pointer-events-none">
                    <p class="text-[10px] text-emerald-300 font-medium" id="game-status-tip"><i class="fas fa-futbol mr-1"></i> Select bet & shoot to score goals!</p>
                </div>
            </div>

            <!-- Target Selection Pad (Active during shootout) -->
            <div id="target-pad" class="hidden absolute inset-x-4 bottom-24 z-30 grid grid-cols-2 gap-3 p-3 bg-black/80 border border-emerald-500/40 rounded-2xl backdrop-blur-md">
                <button onclick="shootBall('TL')" class="py-3 bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 font-bold text-xs rounded-xl border border-emerald-600 tactile-btn">
                    <i class="fas fa-crosshairs mr-1"></i> Top-Left
                </button>
                <button onclick="shootBall('TR')" class="py-3 bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 font-bold text-xs rounded-xl border border-emerald-600 tactile-btn">
                    <i class="fas fa-crosshairs mr-1"></i> Top-Right
                </button>
                <button onclick="shootBall('BL')" class="py-3 bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 font-bold text-xs rounded-xl border border-emerald-600 tactile-btn">
                    <i class="fas fa-crosshairs mr-1"></i> Bottom-Left
                </button>
                <button onclick="shootBall('BR')" class="py-3 bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 font-bold text-xs rounded-xl border border-emerald-600 tactile-btn">
                    <i class="fas fa-crosshairs mr-1"></i> Bottom-Right
                </button>
            </div>

            <!-- Controls Panel -->
            <div class="p-4 bg-slate-900 border-t border-slate-800 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-300 font-medium">Select Bet (₹):</span>
                    <div class="flex gap-1.5">
                        <button onclick="setBet(50)" class="px-3 py-1 bg-slate-800 text-emerald-400 rounded-lg text-xs font-mono font-bold border border-slate-700 tactile-btn">₹50</button>
                        <button onclick="setBet(100)" class="px-3 py-1 bg-slate-800 text-yellow-400 rounded-lg text-xs font-mono font-bold border border-slate-700 tactile-btn">₹100</button>
                        <button onclick="setBet(500)" class="px-3 py-1 bg-slate-800 text-red-400 rounded-lg text-xs font-mono font-bold border border-slate-700 tactile-btn">₹500</button>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <input type="number" id="bet-input" value="50" min="10" class="w-28 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white font-mono outline-none focus:border-emerald-500">
                    
                    <button id="main-action-btn" onclick="startShootout()" class="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-extrabold rounded-xl text-xs shadow-lg tactile-btn">
                        Start Shootout
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Result Modal -->
    <div id="game-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden px-4 backdrop-blur-md">
        <div class="glass-modal rounded-3xl max-w-sm w-full p-6 text-center text-white shadow-2xl">
            <div id="modal-icon" class="w-14 h-14 bg-emerald-500/20 border border-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-emerald-300 text-2xl">
                <i class="fas fa-trophy"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold mb-1">Shootout Complete!</h3>
            <p id="modal-desc" class="text-xs text-gray-300 mb-5 leading-relaxed">Great job!</p>
            <button onclick="closeModal()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold rounded-xl text-xs tactile-btn">
                Continue
            </button>
        </div>
    </div>

    <!-- Firebase & Game Engine Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoXMQtogVuO8O_OXO62JthLagGeqGSPHg",
            authDomain: "anpmoney-290eb.firebaseapp.com",
            projectId: "anpmoney-290eb",
            storageBucket: "anpmoney-290eb.firebasestorage.app",
            messagingSenderId: "609571923036",
            appId: "1:609571923036:web:45544e187ce63adec0f299",
            measurementId: "G-HCW4DY6E6J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userDocRef = null;
        let userBalance = 0;
        let currentBet = 50;

        // Game State Variables
        let gameState = 'IDLE'; // IDLE, SHOOTING, WON, LOST
        let currentRound = 0; // 0 to 4 (5 rounds total)
        const multipliers = [1.2, 1.5, 2.2, 3.5, 5.0];

        let ball = { x: 0, y: 0, targetX: 0, targetY: 0, moving: false, progress: 1 };
        let goalkeeper = { x: 0, targetX: 0, y: 0 };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            resetPositions();
        }
        window.addEventListener('resize', resizeCanvas);

        function resetPositions() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 70;
            ball.targetX = ball.x;
            ball.targetY = ball.y;
            goalkeeper.x = canvas.width / 2;
            goalkeeper.targetX = canvas.width / 2;
            goalkeeper.y = canvas.height / 2 - 20;
        }

        window.setBet = function(amt) {
            if (gameState === 'SHOOTING' || gameState === 'ROUND_ACTIVE') return;
            document.getElementById("bet-input").value = amt;
            currentBet = amt;
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'ANP.HTML';
                return;
            }
            currentUser = user;
            userDocRef = doc(db, "users", user.uid);
            await fetchBalance();
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        });

        async function fetchBalance() {
            try {
                const snap = await getDoc(userDocRef);
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    document.getElementById("game-wallet-balance").innerText = `₹${userBalance.toLocaleString()}`;
                }
            } catch (e) {
                console.error("Balance fetch error:", e);
            }
        }

        window.startShootout = async function() {
            const betInput = parseFloat(document.getElementById("bet-input").value);
            if (!betInput || betInput <= 0) {
                showModal("Invalid Bet", "Please enter a valid amount.", "fas fa-exclamation-triangle", "text-yellow-400");
                return;
            }
            if (betInput > userBalance) {
                showModal("Insufficient Balance", "Your gaming balance is too low.", "fas fa-lock", "text-red-400");
                return;
            }

            currentBet = betInput;
            await updateDoc(userDocRef, { balance: increment(-currentBet) });
            userBalance -= currentBet;
            document.getElementById("game-wallet-balance").innerText = `₹${userBalance.toLocaleString()}`;

            gameState = 'ROUND_ACTIVE';
            currentRound = 0;
            document.getElementById("live-multiplier").innerText = `Multiplier: 1.0x`;
            document.getElementById("main-action-btn").innerText = "Choose Target Zone Above ⬆️";
            document.getElementById("main-action-btn").disabled = true;
            document.getElementById("target-pad").classList.remove("hidden");
            document.getElementById("game-status-tip").innerHTML = `<i class="fas fa-crosshairs mr-1"></i> Round 1: Choose where to shoot!`;
            resetPositions();
        }

        window.shootBall = async function(zone) {
            if (gameState !== 'ROUND_ACTIVE' || ball.moving) return;

            document.getElementById("target-pad").classList.add("hidden");
            ball.moving = true;
            ball.progress = 0;

            const goalWidth = 220;
            const goalLeft = (canvas.width - goalWidth) / 2;
            const goalTop = canvas.height / 2 - 50;

            // Determine target coordinates based on zone
            if (zone === 'TL') {
                ball.targetX = goalLeft + 35;
                ball.targetY = goalTop + 20;
            } else if (zone === 'TR') {
                ball.targetX = goalLeft + goalWidth - 35;
                ball.targetY = goalTop + 20;
            } else if (zone === 'BL') {
                ball.targetX = goalLeft + 35;
                ball.targetY = goalTop + 65;
            } else if (zone === 'BR') {
                ball.targetX = goalLeft + goalWidth - 35;
                ball.targetY = goalTop + 65;
            }

            // Goalkeeper dives randomly (AI difficulty scales with round)
            const keeperZones = ['TL', 'TR', 'BL', 'BR'];
            // Higher rounds make the keeper guess correctly more often
            const blockChance = 0.3 + (currentRound * 0.1);
            let keeperZone = keeperZones[Math.floor(Math.random() * keeperZones.length)];
            if (Math.random() < blockChance) {
                keeperZone = zone; // Keeper blocks!
            }

            if (keeperZone === 'TL') goalkeeper.targetX = goalLeft + 45;
            else if (keeperZone === 'TR') goalkeeper.targetX = goalLeft + goalWidth - 45;
            else if (keeperZone === 'BL') goalkeeper.targetX = goalLeft + 55;
            else if (keeperZone === 'BR') goalkeeper.targetX = goalLeft + goalWidth - 55;

            // Wait for animation to finish then check result
            setTimeout(async () => {
                ball.moving = false;
                const scored = (zone !== keeperZone);

                if (!scored) {
                    // SAVED BY KEEPER!
                    gameState = 'LOST';
                    document.getElementById("target-pad").classList.add("hidden");
                    document.getElementById("main-action-btn").innerText = "Start Shootout";
                    document.getElementById("main-action-btn").disabled = false;
                    showModal("Saved! 🧤", `The goalkeeper blocked your shot on Round ${currentRound + 1}. Lost ₹${currentBet.toLocaleString()}.`, "fas fa-hand-paper", "text-red-400");
                    await fetchBalance();
                } else {
                    // GOAL!
                    currentRound++;
                    document.getElementById("live-multiplier").innerText = `Multiplier: ${multipliers[currentRound - 1]}x`;

                    if (currentRound === 5) {
                        // WON ALL 5 ROUNDS!
                        const winnings = currentBet * multipliers[4];
                        await updateDoc(userDocRef, { balance: increment(winnings) });
                        gameState = 'WON';
                        document.getElementById("target-pad").classList.add("hidden");
                        document.getElementById("main-action-btn").innerText = "Start Shootout";
                        document.getElementById("main-action-btn").disabled = false;
                        showModal("Victory! 🏆", `Incredible! You scored all 5 goals and won ₹${winnings.toLocaleString()} (5.0x)!`, "fas fa-trophy", "text-yellow-400");
                        await fetchBalance();
                    } else {
                        // Next Round
                        gameState = 'ROUND_ACTIVE';
                        document.getElementById("target-pad").classList.remove("hidden");
                        document.getElementById("game-status-tip").innerHTML = `<i class="fas fa-futbol mr-1"></i> Goal! Round ${currentRound + 1} (${multipliers[currentRound]}x): Choose target!`;
                        resetPositions();
                    }
                }
            }, 600);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Pitch / Grass Background
            ctx.fillStyle = '#0a2314';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pitch pattern lines
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 2;
            const goalWidth = 220;
            const goalLeft = (canvas.width - goalWidth) / 2;
            const goalTop = canvas.height / 2 - 50;
            const goalHeight = 100;

            // Penalty Box & Arc
            ctx.strokeRect(goalLeft - 40, goalTop, goalWidth + 80, goalHeight + 80);

            // 2. Draw Football Goal Net
            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.fillRect(goalLeft, goalTop, goalWidth, goalHeight);
            
            // Net Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            for (let gx = goalLeft; gx <= goalLeft + goalWidth; gx += 18) {
                ctx.beginPath(); ctx.moveTo(gx, goalTop); ctx.lineTo(gx, goalTop + goalHeight); ctx.stroke();
            }
            for (let gy = goalTop; gy <= goalTop + goalHeight; gy += 18) {
                ctx.beginPath(); ctx.moveTo(goalLeft, gy); ctx.lineTo(goalLeft + goalWidth, gy); ctx.stroke();
            }

            // Goal Posts (White frame)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(goalLeft, goalTop, goalWidth, goalHeight);

            // 3. Smooth Goalkeeper Movement Animation
            goalkeeper.x += (goalkeeper.targetX - goalkeeper.x) * 0.15;
            ctx.save();
            ctx.fillStyle = '#38bdf8'; // Blue keeper jersey
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(goalkeeper.x - 18, goalkeeper.y - 25, 36, 50, 8) : ctx.fillRect(goalkeeper.x - 18, goalkeeper.y - 25, 36, 50);
            ctx.fill();
            // Keeper head & gloves
            ctx.fillStyle = '#fde047';
            ctx.beginPath(); ctx.arc(goalkeeper.x, goalkeeper.y - 34, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(goalkeeper.x - 26, goalkeeper.y - 10, 10, 14); // Left glove
            ctx.fillRect(goalkeeper.x + 16, goalkeeper.y - 10, 10, 14); // Right glove
            ctx.restore();

            // 4. Ball Animation
            if (ball.moving) {
                ball.progress += 0.08;
                if (ball.progress > 1) ball.progress = 1;
                ball.x += (ball.targetX - ball.x) * 0.25;
                ball.y += (ball.targetY - ball.y) * 0.25;
            }

            // Draw Football
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 12, 0, Math.PI * 2);
            ctx.fill();
            // Ball pentagon pattern dot
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(ball.x + 3, ball.y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function showModal(title, desc, iconClass, colorClass) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-desc").innerText = desc;
            const el = document.getElementById("modal-icon");
            el.className = `w-14 h-14 bg-emerald-500/20 border border-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl ${colorClass}`;
            el.innerHTML = `<i class="${iconClass}"></i>`;
            document.getElementById("game-modal").classList.remove("hidden");
        }

        window.closeModal = function() {
            document.getElementById("game-modal").classList.add("hidden");
            gameState = 'IDLE';
            currentRound = 0;
            resetPositions();
            document.getElementById("live-multiplier").innerText = "Multiplier: 1.0x";
            document.getElementById("main-action-btn").innerText = "Start Shootout";
            document.getElementById("main-action-btn").disabled = false;
            document.getElementById("game-status-tip").innerHTML = `<i class="fas fa-futbol mr-1"></i> Select bet & shoot to score goals!`;
        }

        // Tactile ripple listener
        document.addEventListener('click', function (e) {
            const target = e.target.closest('.tactile-btn');
            if (!target) return;
            const circle = document.createElement('span');
            const rect = target.getBoundingClientRect();
            const d = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${d}px`;
            circle.style.left = `${e.clientX - rect.left - d/2}px`;
            circle.style.top = `${e.clientY - rect.top - d/2}px`;
            circle.classList.add('ripple');
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        });
    </script>
</body>
</html>
